name: CI

on:
  push:
    branches:
      - main
      - rewrite/axum
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The Go implementation this rewrite is checked against. Kept as a full SHA
  # so the baseline stays buildable after the Go sources leave the branch.
  BASELINE_SHA: f314c28936ca26ef5d4844b2617ec287aed16263

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets

      # The lockfile is generated in CI because the rewrite must not be built
      # locally. It is uploaded so the first green run can commit it.
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            binary: wildtoken
          - label: windows-x86_64
            os: windows-latest
            binary: wildtoken.exe
          - label: macos-aarch64
            os: macos-14
            binary: wildtoken
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --bin wildtoken

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.label }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  cross-check:
    name: Cross-check linux-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install the aarch64 cross C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Check linux-aarch64
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo check --locked --target aarch64-unknown-linux-gnu

  docker-smoke:
    name: Docker smoke test
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: wildtoken:ci-${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_NAME: >-
        wildtoken-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag "$IMAGE_NAME" .

      - name: Start container and verify health
        shell: bash
        run: |
          set -euo pipefail
          admin_token='ci-smoke-placeholder-token'
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:3110:3100 \
            --env "ADMIN_TOKEN=$admin_token" \
            --tmpfs /data:rw,noexec,nosuid,size=64m \
            "$IMAGE_NAME"

          healthy=false
          for _ in {1..60}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3110/health \
              --output "$RUNNER_TEMP/wildtoken-health.json"; then
              healthy=true
              break
            fi
            sleep 1
          done

          if [[ "$healthy" != true ]]; then
            echo "WildToken did not become healthy" >&2
            exit 1
          fi

          grep -q '"status":"ok"' "$RUNNER_TEMP/wildtoken-health.json"

      - name: Show container logs on failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Clean up Docker resources
        if: always()
        shell: bash
        run: |
          docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
          docker image rm --force "$IMAGE_NAME" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/wildtoken-health.json"

  baseline:
    name: Build Go baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the baseline revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          persist-credentials: false

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Build baseline binary
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p out
          go build -trimpath -o out/wildtoken ./cmd/wildtoken

      - name: Upload baseline binary
        uses: actions/upload-artifact@v7
        with:
          name: go-baseline
          path: out/wildtoken
          if-no-files-found: error
          retention-days: 14
