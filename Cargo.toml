[package]
name = "wildtoken"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted OpenAI-compatible LLM API gateway"

[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
